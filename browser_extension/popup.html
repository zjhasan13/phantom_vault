<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 340px; margin: 0; padding: 14px; background: #0b1226; color: #eef1ff;
           font: 13px/1.4 system-ui, sans-serif; }
    h1 { font-size: 15px; margin: 0 0 10px; color: #8b7cf6; }
    .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
    .tabs button { flex: 1; border: 1px solid #26315c; border-radius: 8px; padding: 7px;
                   background: #0d1430; color: #8e99c0; cursor: pointer; font-weight: 700; }
    .tabs button.active { background: #8b7cf6; color: #fff; border-color: #8b7cf6; }
    .row { background: #0d1430; border: 1px solid #26315c; border-radius: 10px;
           padding: 10px; margin-bottom: 8px; }
    .t { font-weight: 700; } .u { color: #8e99c0; font-size: 12px; }
    .btns { margin-top: 8px; display: flex; gap: 8px; }
    .btns button, .wide { flex: 1; border: 1px solid #8b7cf6; border-radius: 8px; padding: 7px;
             background: #1a2450; color: #fff; cursor: pointer; font-weight: 700; }
    button.fill { background: #8b7cf6; }
    #status { color: #5b6589; font-size: 12px; text-align: center; }
    #vaultSearch { width: 100%; box-sizing: border-box; background: #0b1226; color: #eef1ff;
      border: 1px solid #26315c; border-radius: 8px; padding: 8px 10px; font-size: 12px;
      margin-bottom: 8px; font-family: inherit; }
    .filterrow { display: flex; gap: 8px; margin-bottom: 8px; }
    .filterrow select { flex: 1; background: #0b1226; color: #eef1ff; border: 1px solid #26315c;
      border-radius: 8px; padding: 6px; font-size: 12px; min-width: 0; }
    .sechead { color: #8e99c0; font-size: 11px; font-weight: 800; margin: 8px 2px 6px;
      padding-top: 6px; border-top: 1px solid #1a2450; }
    .sechead:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
    .brandrow { display: flex; gap: 10px; align-items: center; }
    .brandic { flex: 0 0 auto; width: 32px; height: 32px; border-radius: 16px; background: #8b7cf6;
      color: #080c14; font-weight: 900; font-size: 15px; display: flex;
      align-items: center; justify-content: center; }
    .brandtx { flex: 1; min-width: 0; }
    .emptycard { text-align: center; }
    .emptyart { font-size: 30px; margin: 2px 0 4px; }
    .emptycard .t { margin-bottom: 2px; }
    .emptycard .u { margin-bottom: 8px; }
    .pvinput { width: 100%; box-sizing: border-box; background: #0b1226; color: #eef1ff;
      border: 1px solid #26315c; border-radius: 8px; padding: 8px 10px; font-size: 12px;
      margin-bottom: 6px; font-family: inherit; }
    .emptycard .wide { margin-top: 2px; }
    .t2fa { display: inline-block; font-size: 10px; font-weight: 800; color: #38e1ff;
      background: #0b1226; border: 1px solid #26315c; border-radius: 6px;
      padding: 1px 6px; margin-top: 3px; }
    #langToggle { float: right; flex: 0 0 auto; width: 44px; font-size: 11px; }
    .row.focused { outline: 2px solid #38bdf8; }
    .totp { display: flex; align-items: center; gap: 8px; margin-top: 6px;
            background: #0b1226; border-radius: 8px; padding: 6px 8px; }
    .totp code { flex: 1; color: #38bdf8; font-weight: 800; font-size: 15px; letter-spacing: 2px; }
    .totp button { flex: 0 0 auto; font-size: 11px; padding: 5px 8px; }
    .audit { color: #5b6589; font-size: 11px; margin-top: 4px; }
    .scorebar { height: 10px; border-radius: 6px; background: #1a2450; margin-top: 6px; overflow: hidden; }
    .scorebar div { height: 100%; border-radius: 6px; }
    .statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; font-size: 12px; margin-top: 6px; }
    .statgrid b { color: #38bdf8; }
    .setrow { display: flex; align-items: center; gap: 8px; padding: 7px 2px;
              border-bottom: 1px solid #1a2450; font-size: 12px; }
    .setrow:last-child { border-bottom: 0; }
    .setrow label { flex: 1; }
    .setrow input[type="checkbox"] { width: 16px; height: 16px; accent-color: #8b7cf6; }
    .setrow select, #blocked { background: #0b1226; color: #eef1ff; border: 1px solid #26315c;
              border-radius: 8px; padding: 6px; font-size: 12px; }
    #blocked { width: 100%; box-sizing: border-box; margin-top: 6px; min-height: 52px;
              font-family: inherit; resize: vertical; }
    .hint { color: #5b6589; font-size: 11px; margin-top: 6px; }
    .hidden { display: none; }
    /* Specificity guard: #extLock sets display:flex (1-0-0) which beats
       .hidden (0-1-0) — without this the lock overlay can never hide. */
    #extLock.hidden { display: none; }
    #extLock { position: fixed; inset: 0; z-index: 50; background: #0b1226;
      display: flex; align-items: center; justify-content: center; }
    #extLock .lockcard { width: 260px; text-align: center; background: #0d1430;
      border: 1px solid #26315c; border-radius: 12px; padding: 18px 16px; }
    #extLock .lockart { font-size: 34px; margin-bottom: 6px; }
    .pwline { display: flex; align-items: center; gap: 6px; margin: 6px 0 2px 44px; }
    .pwDots { flex: 1; color: #8e99c0; font-size: 12px; letter-spacing: 1px;
      background: #0b1226; border: 1px solid #26315c; border-radius: 6px;
      padding: 4px 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .eye { background: #1a2450; color: #eef1ff; border: 1px solid #26315c;
      border-radius: 6px; padding: 3px 8px; cursor: pointer; font-size: 13px; }
  </style>
</head>
<body>
  <div id="extLock" class="hidden">
    <div class="lockcard">
      <div class="lockart">🔐</div>
      <div class="t" id="extLockTitle">🔒 Vault is Locked</div>
      <div class="u" id="extLockSub" style="margin:4px 0 10px">Unlock PhantomVault desktop app.</div>
      <input id="extPinInput" class="pvinput" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" style="display:none" />
      <button id="extUnlockBtn" class="wide" style="width:100%;display:none">🔓 Unlock</button>
      <button id="extRetryBtn" class="wide" style="width:100%">🔄 Retry</button>
      <div class="hint" id="extLockMsg"></div>
    </div>
  </div>
  <h1>🛡️ PhantomVault <button id="langToggle" title="BN/EN">EN</button></h1>
  <div class="tabs">
    <button id="tabVault" class="active">🔑 Vault</button>
    <button id="tabStats">📊 Stats</button>
    <button id="tabSettings">⚙️ Autofill Settings</button>
  </div>
  <div id="vaultPane">
    <input id="vaultSearch" placeholder="🔍 Search" />
    <div class="filterrow">
      <select id="folderFilter"><option value="">📁 Folder</option></select>
      <select id="typeFilter">
        <option value="all">📋 Type: All</option>
        <option value="1">🔑 Logins</option>
        <option value="4">💳 Cards</option>
        <option value="5">🪪 Identities</option>
        <option value="3">📝 Notes</option>
      </select>
    </div>
    <div id="suggestHead" class="sechead"></div>
    <button id="neverBtn" class="wide hidden" style="margin-bottom:8px">🚫 Never suggest on this site</button>
    <div id="suggestList"></div>
    <div id="allHead" class="sechead"></div>
    <div id="allList"></div>
    <div class="row" style="margin-top:8px">
      <button id="genToggle" class="wide">🎲 Generator</button>
      <div id="genPanel" class="hidden" style="margin-top:6px">
        <div class="pwline" style="margin-left:0">
          <code id="genOut" class="pwDots">••••••••</code>
          <button id="genNew" class="eye" title="Generate new">🎲</button>
          <button id="genCopy" class="eye" title="Copy">📋</button>
        </div>
        <div class="filterrow" style="margin-top:6px;margin-bottom:0">
          <select id="genLen" title="Length">
            <option value="12">12</option>
            <option value="16">16</option>
            <option value="20" selected>20</option>
            <option value="32">32</option>
          </select>
          <button id="genSym" class="eye" title="Symbols on/off">!@# ✓</button>
        </div>
      </div>
    </div>
    <div id="status">Loading…</div>
  </div>
  <div id="statsPane" class="hidden">
    <div class="row" id="statsBox">Loading…</div>
  </div>
  <div id="settingsPane" class="hidden">
    <div class="row" id="settingsForm"></div>
    <div class="row">
      <div class="t">⏱️ Auto-Lock Timeout</div>
      <div class="hint">No PIN — the extension follows the desktop app. After inactivity it re-asks desktop presence.</div>
      <select id="lockTimeout" style="width:100%;box-sizing:border-box;background:#0b1226;color:#eef1ff;border:1px solid #26315c;border-radius:8px;padding:8px;margin-top:6px;">
        <option value="5">5 minutes</option>
        <option value="10" selected>10 minutes</option>
        <option value="15">15 minutes</option>
        <option value="0">Never</option>
      </select>
    </div>
    <div class="row">
      <div class="t">🚫 Blocked Domains</div>
      <div class="hint">One per line — no badges, no autofill here.</div>
      <textarea id="blocked" placeholder="example.com&#10;internal.corp"></textarea>
    </div>
    <button class="wide" id="saveSettings" style="width:100%">💾 Save Settings</button>
    <div class="hint" id="saveHint"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
