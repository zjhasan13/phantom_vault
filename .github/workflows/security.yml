name: supply-chain-audit

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC

jobs:
  audit:
    runs-on: windows-latest
    # audit-check creates a check run; without `checks: write` it fails with
    # "Resource not accessible by integration" even when the database works.
    # The two ignores are optional ssh-key deps that are NOT in the build
    # graph (see audit.toml); the action needs them as an input, it does not
    # read the repo config file.
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      # TODO(SHA-pin): pin checkout to an immutable commit SHA (Dependabot
      # can't open PRs against SHA pins without automation; tag + weekly
      # audit is the interim posture).
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: RUSTSEC-2023-0071,RUSTSEC-2026-0387

  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # -j 1: the documented share_serve / loopback flakes under parallel test
      # threads; CI was red on them before this (see docs/SESSION_STATE.md).
      - run: cargo check --all-targets -j 1
      - run: cargo clippy --all-targets -j 1 -- -D warnings
      - run: cargo test -j 1
      - run: cargo test -j 1 --manifest-path tools/pv-sign/Cargo.toml
      # The extension gates are part of "done" (AGENTS.md §4) but were never
      # run in CI; a JS regression could merge green.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - run: npm run test:tokens
