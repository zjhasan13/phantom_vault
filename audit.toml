# RustSec configuration (read by local `cargo-audit`). The CI action does NOT
# read this file: the same two IDs are passed via `with.ignore` in
# .github/workflows/security.yml. Keep both lists in sync.
[advisories]
# Re-verified 2026-11-15 after the octocrab 0.41 -> 0.50 bump:
#   cargo tree -i rsa           -> rsa 0.9.10 <- jsonwebtoken 10.4.0 <- octocrab
#   cargo tree -i crypto-bigint -> crypto-bigint 0.5.5 <- elliptic-curve <- rsa
# Both ARE compiled into the binary (the 2026-10-31 note below said they were
# absent, which stopped being true when octocrab pulled jsonwebtoken in). They
# stay ignored because the vulnerable operation is unreachable: jsonwebtoken
# pulls `rsa` for RS256 JWTs, which only GitHub *App* authentication uses, and
# this app authenticates with a personal access token — so no JWT is ever signed
# or verified. RUSTSEC-2023-0071 (Marvin) is a decryption timing oracle; there
# is no RSA decryption path in this binary. Re-check if GitHub App auth lands.
ignore = [
  "RUSTSEC-2023-0071", # rsa: RS256 sign/verify only, no decryption path
  "RUSTSEC-2026-0387", # crypto-bigint 0.5: reachable only through rsa's curves
]
