# RustSec configuration (read by local `cargo-audit`). The CI action does NOT
# read this file: the same two IDs are passed via `with.ignore` in
# .github/workflows/security.yml. Keep both lists in sync.
[advisories]
# Both advisories are on optional `ssh-key` dependencies that are NOT enabled
# in any build of this crate (verified 2026-10-31 with `cargo tree -i rsa` and
# `cargo tree -i elliptic-curve`, both empty). They stay in Cargo.lock because
# the lockfile is feature-independent; ignoring them keeps the audit signal
# focused on code that actually ships. Re-check when `ssh-key` enables them.
ignore = [
  "RUSTSEC-2023-0071", # rsa: optional ssh-key dep, not compiled
  "RUSTSEC-2026-0387", # crypto-bigint 0.5: only via rsa/elliptic-curve, not compiled
]
