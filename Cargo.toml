[package]
name = "phantom_vault"
version = "0.1.0"
edition = "2021"

[dependencies]
# Cryptography
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["std"] }

arboard = "3.4"

# Memory Hardening
zeroize = { version = "1.8", features = ["derive"] }

# Serialization & Binary Storage
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# 2FA Authenticator Engine
totp-rs = { version = "5.7", features = ["gen_secret"] }

# Native Slint GUI Engine
slint = { version = "1.8", features = ["raw-window-handle-06"] }

# Phase 8: Google Migration & QR Scanner
prost = "0.13"
base64 = "0.22"
data-encoding = "2.6"
url = "2.5"
rqrr = "0.7"
image = "0.25"
percent-encoding = "2.3"

# Phase 10: Secure Generator
rand = "0.8"
secrecy = "0.8"
thiserror = "2"
once_cell = "1.19"

# Phase 18: Omni-Universal Vault Importer
csv = "1.3"
serde_json = "1.0"
quick-xml = "0.36"
rfd = "0.14"

# Phase 16 (Option 2): developer superpowers
rpassword = "7"
ssh-key = { version = "0.6", features = ["ed25519", "alloc"] }
ed25519-dalek = "2"

# Phase 14: Post-quantum hybrid (ML-KEM-768 + HKDF-SHA256)
ml-kem = "0.2"
hkdf = "0.12"
sha2 = "0.10"

# Phase 12: Zero-knowledge GitHub sync (ciphertext only)
octocrab = "0.38"
http = "1"

# Phase 11: Windows Hello (WinRT) + async bridge
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_ProcessStatus",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Security_Cryptography",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Security_Credentials_UI",
] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time"] }

# Windows Anti-Capture (OBS/Discord Blackout)
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Foundation"] }

# Phase 9: Global Quick-Bar
global-hotkey = "0.6"

# Raw window handle for HWND extraction
raw-window-handle = "0.6"

[build-dependencies]
slint-build = "1.8"

[profile.dev.build-override]
opt-level = 0

# Fast Argon2id in dev without OOM: optimize only crypto/hot crates
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.cipher]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.cpufeatures]
opt-level = 3
[profile.dev.package.subtle]
opt-level = 3
[profile.dev.package.generic-array]
opt-level = 3
[profile.dev.package.rand_core]
opt-level = 3
[profile.dev.package.password-hash]
opt-level = 3