[package]
name = "phantom_vault"
version = "0.1.0"
edition = "2021"

[dependencies]
# Cryptography
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["std"] }

arboard = "3.4"

# Memory Hardening
zeroize = { version = "1.8", features = ["derive"] }

# Serialization & Binary Storage
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# 2FA Authenticator Engine
totp-rs = { version = "5.7", features = ["gen_secret"] }

# Native Slint GUI Engine
slint = { version = "1.8", features = ["raw-window-handle-06"] }

# Phase 8: Google Migration & QR Scanner
prost = "0.13"
base64 = "0.22"
data-encoding = "2.6"
url = "2.5"
rqrr = "0.7"
image = "0.25"
percent-encoding = "2.3"

# Windows Anti-Capture (OBS/Discord Blackout)
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }

# Phase 9: Global Quick-Bar
global-hotkey = "0.6"

# Raw window handle for HWND extraction
raw-window-handle = "0.6"

[build-dependencies]
slint-build = "1.8"

[profile.dev.package."*"]
opt-level = 3

# Keep proc-macros unoptimized to avoid prefer-dynamic conflict
[profile.dev.package.windows-implement]
opt-level = 0
[profile.dev.package.windows-interface]
opt-level = 0
[profile.dev.build-override]
opt-level = 0