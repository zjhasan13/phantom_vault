[package]
name = "phantom_vault"
version = "0.2.0"
edition = "2021"

[dependencies]
# Cryptography
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["std"] }

arboard = "3.4"

# Memory Hardening
zeroize = { version = "1.8", features = ["derive"] }

# Serialization & Binary Storage
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# 2FA Authenticator Engine
totp-rs = { version = "5.7", features = ["gen_secret"] }

# Native Slint GUI Engine
# Diet: software renderer only (drops femtovg/OpenGL + slint system-tray —
# custom tray.rs is raw windows-sys). Accessibility kept (no a11y regression).
# Slint is ours alone in the tree (no unification trap) — this directly
# shrinks the exe and kills the GPU context for tray-sitting.
slint = { version = "1.8", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-2", "raw-window-handle-06"] }

# Phase 8: Google Migration & QR Scanner
prost = "0.13"
base64 = "0.22"
data-encoding = "2.6"
url = "2.5"
# RUSTSEC-2026-0002/0253 (lru UB via rqrr): 0.11 moves off the affected
# lru. Fallback-only QR path (3 calls: prepare/detect_grids/decode).
rqrr = "0.11"
# Indestructible QR ingestion: ZXing-port multi-pass decoder (+ rqrr fallback).
rxing = "0.9"
# Diet: only the formats QR/favicon/custom-logos need (png/ico/jpeg/gif/
# bmp/webp). HONEST CAVEAT: single shared image 0.25.x with arboard→slint
# (full defaults) means feature unification keeps avif/exr/tiff linked in
# the final binary TODAY — this line documents intent and pays off if/when
# upstream trims. Webp stays: file picker allows it.
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "gif", "bmp", "webp"] }
# Zero-lockin: on-screen Google Authenticator migration QR (grid API only —
# PNG rasterized manually via `image`, no default features needed).
qrcode = { version = "0.14", default-features = false }
percent-encoding = "2.3"

# Batch-4: live webcam QR capture (Windows Media Foundation backend).
# Optional: default builds include it (existing behavior); slim lightweight
# releases pass `--no-default-features` to drop the whole camera stack.
nokhwa = { version = "0.10", features = ["input-native"], optional = true }

# Phase 10: Secure Generator
rand = "0.8"
secrecy = "0.8"
thiserror = "2"
once_cell = "1.19"

# Phase 25: HIBP k-anonymity breach check
# Diet: rustls-only TLS (drops schannel/native-tls second stack), no http2
# (all endpoints fine on 1.1). KEEPS socks (Tor socks5h was advertised but
# broken without it) + charset (.text() callers). No json/stream/multipart.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "charset"] }

# Phase 18: Omni-Universal Vault Importer
csv = "1.3"
serde_json = "1.0"
# RUSTSEC-2026-0194/0195 (DoS): 0.41 bounds attr-scan + namespace alloc.
# keepass.rs uses only the stable core API (from_str/read_event_into/
# Event/QName/unescape) — unchanged across the bump, verified by tests.
quick-xml = "0.41"
rfd = "0.14"

# Phase 16 (Option 2): developer superpowers
rpassword = "7"
ssh-key = { version = "0.6", features = ["ed25519", "alloc"] }
ed25519-dalek = "2"

# Phase 14: Post-quantum hybrid (ML-KEM-768 + HKDF-SHA256)
ml-kem = "0.2"
hkdf = "0.12"
sha2 = "0.10"
# Phase 24: dynamic OTP (HOTP RFC 4226 needs HMAC-SHA1)
hmac = "0.12"
sha1 = "0.10"

# Phase 12: Zero-knowledge GitHub sync (ciphertext only)
# RUSTSEC-2026-0049/0098/0099/0104 (rustls-webpki): 0.41 moves the TLS
# chain to hyper-rustls 0.27 / rustls 0.23 / webpki 0.103. Minimal jump
# from 0.38 (same tower/secrecy stack); sync API surface re-verified
# by build + existing proxy/sync tests.
octocrab = "0.41"
http = "1"

# Phase 11: Windows Hello (WinRT) + async bridge
# Phase 25: BLE proximity auto-lock (WinRT advertisement watcher + radio probe)
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_ProcessStatus",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Security_Cryptography",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Security_Credentials_UI",
    "Foundation",
    "Devices_Bluetooth_Advertisement",
] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time"] }

# Windows Anti-Capture (OBS/Discord Blackout)
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_Ime", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_Foundation"] }

# Phase 9: Global Quick-Bar
global-hotkey = "0.6"

# Raw window handle for HWND extraction
raw-window-handle = "0.6"

# Diet: mi-malloc reclaims freed pages to the OS instead of hoarding heap.
mimalloc = { version = "0.1", default-features = false }

# Lightweight releases: default builds include the camera stack (existing
# behavior); `--no-default-features` drops nokhwa entirely via the stub in
# authenticator::camera_scanner.
[features]
default = ["camera"]
camera = ["dep:nokhwa"]

[build-dependencies]
slint-build = "1.8"
winres = "0.1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.build-override]
opt-level = 0

# Fast Argon2id in dev without OOM: optimize only crypto/hot crates
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.cipher]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.cpufeatures]
opt-level = 3
[profile.dev.package.subtle]
opt-level = 3
[profile.dev.package.generic-array]
opt-level = 3
[profile.dev.package.rand_core]
opt-level = 3
[profile.dev.package.password-hash]
opt-level = 3